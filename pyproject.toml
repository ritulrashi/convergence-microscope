[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convergence-microscope"
version = "0.1.0"
description = "Per-packet convergence forensics for emulated FRR networks"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12",
  "jinja2>=3.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
labctl = "labctl.cli:app"
labgen = "labgen.cli:app"

[tool.setuptools.packages.find]
include = ["labgen*", "labctl*"]

[tool.setuptools.package-data]
labgen = ["templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
