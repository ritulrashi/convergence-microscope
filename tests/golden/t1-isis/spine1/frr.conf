frr defaults datacenter
hostname spine1
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.1/32
 ip router isis core
 isis passive
exit
!
interface eth1
 description fabric to leaf1
 ip address 10.1.0.1/31
 ip router isis core
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 10
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
interface eth2
 description fabric to leaf2
 ip address 10.1.0.5/31
 ip router isis core
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 10
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
interface eth3
 description fabric to leaf3
 ip address 10.1.0.9/31
 ip router isis core
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 10
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
interface eth4
 description fabric to leaf4
 ip address 10.1.0.13/31
 ip router isis core
 isis network point-to-point
 isis circuit-type level-2-only
 isis metric 10
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
router isis core
 net 49.0001.0100.0000.0001.00
 is-type level-2-only
 metric-style wide
 log-adjacency-changes
 spf-delay-ietf init-delay 50 short-delay 200 long-delay 5000 holddown 10000 time-to-learn 500
exit
!
