frr defaults datacenter
hostname leaf3
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.5/32
exit
!
interface eth1
 description fabric to spine1
 ip address 10.1.0.8/31
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface eth2
 description fabric to spine2
 ip address 10.1.0.10/31
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface eth3
 description host to h3
 ip address 10.10.3.1/24
exit
!
router ospf
 ospf router-id 10.0.0.5
 log-adjacency-changes detail
 timers throttle spf 50 200 5000
 maximum-paths 64
 passive-interface lo
 passive-interface eth3
 network 10.0.0.5/32 area 0
 network 10.1.0.8/31 area 0
 network 10.1.0.10/31 area 0
 network 10.10.3.0/24 area 0
exit
!
