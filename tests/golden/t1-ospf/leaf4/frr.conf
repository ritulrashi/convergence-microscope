frr defaults datacenter
hostname leaf4
log stdout informational
service integrated-vtysh-config
!
interface eth1
 description fabric to spine1
 ip address 10.1.0.12/31
 ip ospf cost 10
 ip ospf dead-interval 3
 ip ospf hello-interval 1
 ip ospf network point-to-point
exit
!
interface eth2
 description fabric to spine2
 ip address 10.1.0.14/31
 ip ospf cost 10
 ip ospf dead-interval 3
 ip ospf hello-interval 1
 ip ospf network point-to-point
exit
!
interface eth3
 description host to h4
 ip address 10.10.4.1/24
 ip ospf passive
exit
!
interface lo
 ip address 10.0.0.6/32
 ip ospf passive
exit
!
router ospf
 ospf router-id 10.0.0.6
 log-adjacency-changes detail
 timers throttle spf 50 200 5000
 network 10.0.0.6/32 area 0
 network 10.1.0.12/31 area 0
 network 10.1.0.14/31 area 0
 network 10.10.4.0/24 area 0
exit
!
