frr defaults datacenter
hostname spine1
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.1/32
exit
!
interface eth1
 description fabric to leaf1
 ip address 10.1.0.1/31
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface eth2
 description fabric to leaf2
 ip address 10.1.0.5/31
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface eth3
 description fabric to leaf3
 ip address 10.1.0.9/31
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface eth4
 description fabric to leaf4
 ip address 10.1.0.13/31
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
router ospf
 ospf router-id 10.0.0.1
 log-adjacency-changes detail
 timers throttle spf 50 200 5000
 maximum-paths 64
 passive-interface lo
 network 10.0.0.1/32 area 0
 network 10.1.0.0/31 area 0
 network 10.1.0.4/31 area 0
 network 10.1.0.8/31 area 0
 network 10.1.0.12/31 area 0
exit
!
