frr defaults datacenter
hostname r4
log stdout informational
service integrated-vtysh-config
!
interface eth1
 description fabric to r3
 ip address 10.1.0.5/31
 ip router isis core
 isis circuit-type level-2-only
 isis hello-interval 1
 isis hello-multiplier 3
 isis network point-to-point
exit
!
interface eth2
 description fabric to r5
 ip address 10.1.0.6/31
 ip router isis core
 isis circuit-type level-2-only
 isis hello-interval 1
 isis hello-multiplier 3
 isis network point-to-point
exit
!
interface eth3
 description fabric to r1
 ip address 10.1.0.13/31
 ip router isis core
 isis circuit-type level-2-only
 isis metric 25
 isis hello-interval 1
 isis hello-multiplier 3
 isis network point-to-point
exit
!
interface eth4
 description host to h4
 ip address 10.10.4.1/24
 ip router isis core
 isis passive
exit
!
interface lo
 ip address 10.0.0.4/32
 ip router isis core
 isis passive
exit
!
router isis core
 is-type level-2-only
 net 49.0001.0100.0000.0004.00
 spf-delay-ietf init-delay 50 short-delay 200 long-delay 5000 holddown 10000 time-to-learn 500
 log-adjacency-changes
exit
!
