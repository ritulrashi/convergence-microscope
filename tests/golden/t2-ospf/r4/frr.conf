frr defaults datacenter
hostname r4
log stdout informational
service integrated-vtysh-config
!
interface eth1
 description fabric to r3
 ip address 10.1.0.5/31
 ip ospf cost 10
 ip ospf dead-interval 3
 ip ospf hello-interval 1
 ip ospf network point-to-point
exit
!
interface eth2
 description fabric to r5
 ip address 10.1.0.6/31
 ip ospf cost 10
 ip ospf dead-interval 3
 ip ospf hello-interval 1
 ip ospf network point-to-point
exit
!
interface eth3
 description fabric to r1
 ip address 10.1.0.13/31
 ip ospf cost 25
 ip ospf dead-interval 3
 ip ospf hello-interval 1
 ip ospf network point-to-point
exit
!
interface eth4
 description host to h4
 ip address 10.10.4.1/24
 ip ospf passive
exit
!
interface lo
 ip address 10.0.0.4/32
 ip ospf passive
exit
!
router ospf
 ospf router-id 10.0.0.4
 log-adjacency-changes detail
 timers throttle spf 50 200 5000
 network 10.0.0.4/32 area 0
 network 10.1.0.4/31 area 0
 network 10.1.0.6/31 area 0
 network 10.1.0.12/31 area 0
 network 10.10.4.0/24 area 0
exit
!
