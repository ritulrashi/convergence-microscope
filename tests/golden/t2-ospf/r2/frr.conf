frr defaults datacenter
hostname r2
log stdout informational
service integrated-vtysh-config
!
interface eth1
 description fabric to r1
 ip address 10.1.0.1/31
 ip ospf cost 10
 ip ospf dead-interval 3
 ip ospf hello-interval 1
 ip ospf network point-to-point
exit
!
interface eth2
 description fabric to r3
 ip address 10.1.0.2/31
 ip ospf cost 10
 ip ospf dead-interval 3
 ip ospf hello-interval 1
 ip ospf network point-to-point
exit
!
interface eth3
 description fabric to r5
 ip address 10.1.0.14/31
 ip ospf cost 30
 ip ospf dead-interval 3
 ip ospf hello-interval 1
 ip ospf network point-to-point
exit
!
interface lo
 ip address 10.0.0.2/32
 ip ospf passive
exit
!
router ospf
 ospf router-id 10.0.0.2
 log-adjacency-changes detail
 timers throttle spf 50 200 5000
 network 10.0.0.2/32 area 0
 network 10.1.0.0/31 area 0
 network 10.1.0.2/31 area 0
 network 10.1.0.14/31 area 0
exit
!
