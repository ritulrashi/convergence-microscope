frr defaults datacenter
hostname r6
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.6/32
exit
!
interface eth1
 description fabric to r5
 ip address 10.1.0.9/31
exit
!
interface eth2
 description fabric to r1
 ip address 10.1.0.10/31
exit
!
ip prefix-list LOCAL seq 5 permit 10.0.0.6/32
!
route-map IMPORT permit 10
exit
!
route-map EXPORT permit 10
exit
!
router bgp 65006
 bgp router-id 10.0.0.6
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 timers bgp 1 3
 neighbor 10.1.0.8 remote-as 65005
 neighbor 10.1.0.8 description r5
 neighbor 10.1.0.8 timers connect 2
 neighbor 10.1.0.11 remote-as 65001
 neighbor 10.1.0.11 description r1
 neighbor 10.1.0.11 timers connect 2
 !
 address-family ipv4 unicast
  network 10.0.0.6/32
  neighbor 10.1.0.8 route-map IMPORT in
  neighbor 10.1.0.8 route-map EXPORT out
  neighbor 10.1.0.11 route-map IMPORT in
  neighbor 10.1.0.11 route-map EXPORT out
  maximum-paths 64
 exit-address-family
exit
!
