frr defaults datacenter
hostname r3
log stdout informational
service integrated-vtysh-config
!
ip prefix-list LOCAL seq 5 permit 10.0.0.3/32
ip prefix-list LOCAL seq 10 permit 10.10.3.0/24
!
route-map IMPORT permit 10
exit
!
route-map EXPORT permit 10
exit
!
interface eth1
 description fabric to r2
 ip address 10.1.0.3/31
exit
!
interface eth2
 description fabric to r4
 ip address 10.1.0.4/31
exit
!
interface eth3
 description host to h3
 ip address 10.10.3.1/24
exit
!
interface lo
 ip address 10.0.0.3/32
exit
!
router bgp 65003
 bgp router-id 10.0.0.3
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 timers bgp 1 3
 neighbor 10.1.0.2 remote-as 65002
 neighbor 10.1.0.2 description r2
 neighbor 10.1.0.2 timers connect 2
 neighbor 10.1.0.5 remote-as 65004
 neighbor 10.1.0.5 description r4
 neighbor 10.1.0.5 timers connect 2
 use-underlays-nexthop-weight
 !
 address-family ipv4 unicast
  network 10.0.0.3/32
  network 10.10.3.0/24
  neighbor 10.1.0.2 route-map IMPORT in
  neighbor 10.1.0.2 route-map EXPORT out
  neighbor 10.1.0.5 route-map IMPORT in
  neighbor 10.1.0.5 route-map EXPORT out
 exit-address-family
exit
!
