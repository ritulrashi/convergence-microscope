name: cm-t2-ebgp
topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:TEST
      binds:
      - r1/frr.conf:/etc/frr/frr.conf
      - r1/daemons:/etc/frr/daemons
      - r1/vtysh.conf:/etc/frr/vtysh.conf
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.fib_multipath_hash_policy: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
        net.ipv6.conf.all.disable_ipv6: 1
      labels:
        cm-role: router
    r2:
      kind: linux
      image: quay.io/frrouting/frr:TEST
      binds:
      - r2/frr.conf:/etc/frr/frr.conf
      - r2/daemons:/etc/frr/daemons
      - r2/vtysh.conf:/etc/frr/vtysh.conf
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.fib_multipath_hash_policy: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
        net.ipv6.conf.all.disable_ipv6: 1
      labels:
        cm-role: router
    r3:
      kind: linux
      image: quay.io/frrouting/frr:TEST
      binds:
      - r3/frr.conf:/etc/frr/frr.conf
      - r3/daemons:/etc/frr/daemons
      - r3/vtysh.conf:/etc/frr/vtysh.conf
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.fib_multipath_hash_policy: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
        net.ipv6.conf.all.disable_ipv6: 1
      labels:
        cm-role: router
    r4:
      kind: linux
      image: quay.io/frrouting/frr:TEST
      binds:
      - r4/frr.conf:/etc/frr/frr.conf
      - r4/daemons:/etc/frr/daemons
      - r4/vtysh.conf:/etc/frr/vtysh.conf
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.fib_multipath_hash_policy: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
        net.ipv6.conf.all.disable_ipv6: 1
      labels:
        cm-role: router
    r5:
      kind: linux
      image: quay.io/frrouting/frr:TEST
      binds:
      - r5/frr.conf:/etc/frr/frr.conf
      - r5/daemons:/etc/frr/daemons
      - r5/vtysh.conf:/etc/frr/vtysh.conf
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.fib_multipath_hash_policy: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
        net.ipv6.conf.all.disable_ipv6: 1
      labels:
        cm-role: router
    r6:
      kind: linux
      image: quay.io/frrouting/frr:TEST
      binds:
      - r6/frr.conf:/etc/frr/frr.conf
      - r6/daemons:/etc/frr/daemons
      - r6/vtysh.conf:/etc/frr/vtysh.conf
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.fib_multipath_hash_policy: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
        net.ipv6.conf.all.disable_ipv6: 1
      labels:
        cm-role: router
    h1:
      kind: linux
      image: cm-host:latest
      exec:
      - ip addr add 10.10.1.10/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.10.1.1 dev eth1
      labels:
        cm-role: host
    h3:
      kind: linux
      image: cm-host:latest
      exec:
      - ip addr add 10.10.3.10/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.10.3.1 dev eth1
      labels:
        cm-role: host
    h4:
      kind: linux
      image: cm-host:latest
      exec:
      - ip addr add 10.10.4.10/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.10.4.1 dev eth1
      labels:
        cm-role: host
  links:
  - endpoints:
    - r1:eth1
    - r2:eth1
  - endpoints:
    - r2:eth2
    - r3:eth1
  - endpoints:
    - r3:eth2
    - r4:eth1
  - endpoints:
    - r4:eth2
    - r5:eth1
  - endpoints:
    - r5:eth2
    - r6:eth1
  - endpoints:
    - r6:eth2
    - r1:eth2
  - endpoints:
    - r1:eth3
    - r4:eth3
  - endpoints:
    - r2:eth3
    - r5:eth3
  - endpoints:
    - r1:eth4
    - h1:eth1
  - endpoints:
    - r3:eth3
    - h3:eth1
  - endpoints:
    - r4:eth4
    - h4:eth1
