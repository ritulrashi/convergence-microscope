frr defaults datacenter
hostname r5
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.5/32
exit
!
interface eth1
 description fabric to r4
 ip address 10.1.0.7/31
exit
!
interface eth2
 description fabric to r6
 ip address 10.1.0.8/31
exit
!
interface eth3
 description fabric to r2
 ip address 10.1.0.15/31
exit
!
ip prefix-list LOCAL seq 5 permit 10.0.0.5/32
!
route-map IMPORT permit 10
exit
!
route-map EXPORT permit 10
exit
!
router bgp 65005
 bgp router-id 10.0.0.5
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 timers bgp 1 3
 neighbor 10.1.0.6 remote-as 65004
 neighbor 10.1.0.6 description r4
 neighbor 10.1.0.6 timers connect 2
 neighbor 10.1.0.9 remote-as 65006
 neighbor 10.1.0.9 description r6
 neighbor 10.1.0.9 timers connect 2
 neighbor 10.1.0.14 remote-as 65002
 neighbor 10.1.0.14 description r2
 neighbor 10.1.0.14 timers connect 2
 !
 address-family ipv4 unicast
  network 10.0.0.5/32
  neighbor 10.1.0.6 route-map IMPORT in
  neighbor 10.1.0.6 route-map EXPORT out
  neighbor 10.1.0.9 route-map IMPORT in
  neighbor 10.1.0.9 route-map EXPORT out
  neighbor 10.1.0.14 route-map IMPORT in
  neighbor 10.1.0.14 route-map EXPORT out
  maximum-paths 64
 exit-address-family
exit
!
