frr defaults datacenter
hostname r2
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.2/32
exit
!
interface eth1
 description fabric to r1
 ip address 10.1.0.1/31
exit
!
interface eth2
 description fabric to r3
 ip address 10.1.0.2/31
exit
!
interface eth3
 description fabric to r5
 ip address 10.1.0.14/31
exit
!
ip prefix-list LOCAL seq 5 permit 10.0.0.2/32
!
route-map IMPORT permit 10
exit
!
route-map EXPORT permit 10
exit
!
router bgp 65002
 bgp router-id 10.0.0.2
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 timers bgp 1 3
 neighbor 10.1.0.0 remote-as 65001
 neighbor 10.1.0.0 description r1
 neighbor 10.1.0.0 timers connect 2
 neighbor 10.1.0.3 remote-as 65003
 neighbor 10.1.0.3 description r3
 neighbor 10.1.0.3 timers connect 2
 neighbor 10.1.0.15 remote-as 65005
 neighbor 10.1.0.15 description r5
 neighbor 10.1.0.15 timers connect 2
 !
 address-family ipv4 unicast
  network 10.0.0.2/32
  neighbor 10.1.0.0 route-map IMPORT in
  neighbor 10.1.0.0 route-map EXPORT out
  neighbor 10.1.0.3 route-map IMPORT in
  neighbor 10.1.0.3 route-map EXPORT out
  neighbor 10.1.0.15 route-map IMPORT in
  neighbor 10.1.0.15 route-map EXPORT out
  maximum-paths 64
 exit-address-family
exit
!
