frr defaults datacenter
hostname r4
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.4/32
exit
!
interface eth1
 description fabric to r3
 ip address 10.1.0.5/31
exit
!
interface eth2
 description fabric to r5
 ip address 10.1.0.6/31
exit
!
interface eth3
 description fabric to r1
 ip address 10.1.0.13/31
exit
!
interface eth4
 description host to h4
 ip address 10.10.4.1/24
exit
!
ip prefix-list LOCAL seq 5 permit 10.0.0.4/32
ip prefix-list LOCAL seq 10 permit 10.10.4.0/24
!
route-map IMPORT permit 10
exit
!
route-map EXPORT permit 10
exit
!
router bgp 65004
 bgp router-id 10.0.0.4
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 timers bgp 1 3
 neighbor 10.1.0.4 remote-as 65003
 neighbor 10.1.0.4 description r3
 neighbor 10.1.0.4 timers connect 2
 neighbor 10.1.0.7 remote-as 65005
 neighbor 10.1.0.7 description r5
 neighbor 10.1.0.7 timers connect 2
 neighbor 10.1.0.12 remote-as 65001
 neighbor 10.1.0.12 description r1
 neighbor 10.1.0.12 timers connect 2
 !
 address-family ipv4 unicast
  network 10.0.0.4/32
  network 10.10.4.0/24
  neighbor 10.1.0.4 route-map IMPORT in
  neighbor 10.1.0.4 route-map EXPORT out
  neighbor 10.1.0.7 route-map IMPORT in
  neighbor 10.1.0.7 route-map EXPORT out
  neighbor 10.1.0.12 route-map IMPORT in
  neighbor 10.1.0.12 route-map EXPORT out
  maximum-paths 64
 exit-address-family
exit
!
