name: cm-t1-ebgp
topology:
  nodes:
    spine1:
      kind: linux
      image: quay.io/frrouting/frr:TEST
      binds:
      - spine1/frr.conf:/etc/frr/frr.conf
      - spine1/daemons:/etc/frr/daemons
      - spine1/vtysh.conf:/etc/frr/vtysh.conf
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.fib_multipath_hash_policy: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
        net.ipv6.conf.all.disable_ipv6: 1
      labels:
        cm-role: spine
    spine2:
      kind: linux
      image: quay.io/frrouting/frr:TEST
      binds:
      - spine2/frr.conf:/etc/frr/frr.conf
      - spine2/daemons:/etc/frr/daemons
      - spine2/vtysh.conf:/etc/frr/vtysh.conf
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.fib_multipath_hash_policy: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
        net.ipv6.conf.all.disable_ipv6: 1
      labels:
        cm-role: spine
    leaf1:
      kind: linux
      image: quay.io/frrouting/frr:TEST
      binds:
      - leaf1/frr.conf:/etc/frr/frr.conf
      - leaf1/daemons:/etc/frr/daemons
      - leaf1/vtysh.conf:/etc/frr/vtysh.conf
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.fib_multipath_hash_policy: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
        net.ipv6.conf.all.disable_ipv6: 1
      labels:
        cm-role: leaf
    leaf2:
      kind: linux
      image: quay.io/frrouting/frr:TEST
      binds:
      - leaf2/frr.conf:/etc/frr/frr.conf
      - leaf2/daemons:/etc/frr/daemons
      - leaf2/vtysh.conf:/etc/frr/vtysh.conf
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.fib_multipath_hash_policy: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
        net.ipv6.conf.all.disable_ipv6: 1
      labels:
        cm-role: leaf
    leaf3:
      kind: linux
      image: quay.io/frrouting/frr:TEST
      binds:
      - leaf3/frr.conf:/etc/frr/frr.conf
      - leaf3/daemons:/etc/frr/daemons
      - leaf3/vtysh.conf:/etc/frr/vtysh.conf
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.fib_multipath_hash_policy: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
        net.ipv6.conf.all.disable_ipv6: 1
      labels:
        cm-role: leaf
    leaf4:
      kind: linux
      image: quay.io/frrouting/frr:TEST
      binds:
      - leaf4/frr.conf:/etc/frr/frr.conf
      - leaf4/daemons:/etc/frr/daemons
      - leaf4/vtysh.conf:/etc/frr/vtysh.conf
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.fib_multipath_hash_policy: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
        net.ipv6.conf.all.disable_ipv6: 1
      labels:
        cm-role: leaf
    h1:
      kind: linux
      image: cm-host:latest
      exec:
      - ip addr add 10.10.1.10/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.10.1.1 dev eth1
      labels:
        cm-role: host
    h2:
      kind: linux
      image: cm-host:latest
      exec:
      - ip addr add 10.10.2.10/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.10.2.1 dev eth1
      labels:
        cm-role: host
    h3:
      kind: linux
      image: cm-host:latest
      exec:
      - ip addr add 10.10.3.10/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.10.3.1 dev eth1
      labels:
        cm-role: host
    h4:
      kind: linux
      image: cm-host:latest
      exec:
      - ip addr add 10.10.4.10/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.10.4.1 dev eth1
      labels:
        cm-role: host
  links:
  - endpoints:
    - leaf1:eth1
    - spine1:eth1
  - endpoints:
    - leaf1:eth2
    - spine2:eth1
  - endpoints:
    - leaf2:eth1
    - spine1:eth2
  - endpoints:
    - leaf2:eth2
    - spine2:eth2
  - endpoints:
    - leaf3:eth1
    - spine1:eth3
  - endpoints:
    - leaf3:eth2
    - spine2:eth3
  - endpoints:
    - leaf4:eth1
    - spine1:eth4
  - endpoints:
    - leaf4:eth2
    - spine2:eth4
  - endpoints:
    - leaf1:eth3
    - h1:eth1
  - endpoints:
    - leaf2:eth3
    - h2:eth1
  - endpoints:
    - leaf3:eth3
    - h3:eth1
  - endpoints:
    - leaf4:eth3
    - h4:eth1
