frr defaults datacenter
hostname leaf4
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.6/32
exit
!
interface eth1
 description fabric to spine1
 ip address 10.1.0.12/31
exit
!
interface eth2
 description fabric to spine2
 ip address 10.1.0.14/31
exit
!
interface eth3
 description host to h4
 ip address 10.10.4.1/24
exit
!
ip prefix-list LOCAL seq 5 permit 10.0.0.6/32
ip prefix-list LOCAL seq 10 permit 10.10.4.0/24
!
route-map IMPORT permit 10
exit
!
route-map EXPORT permit 10
 match ip address prefix-list LOCAL
exit
!
router bgp 65104
 bgp router-id 10.0.0.6
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 timers bgp 1 3
 neighbor 10.1.0.13 remote-as 65000
 neighbor 10.1.0.13 description spine1
 neighbor 10.1.0.13 timers connect 2
 neighbor 10.1.0.15 remote-as 65000
 neighbor 10.1.0.15 description spine2
 neighbor 10.1.0.15 timers connect 2
 !
 address-family ipv4 unicast
  network 10.0.0.6/32
  network 10.10.4.0/24
  neighbor 10.1.0.13 route-map IMPORT in
  neighbor 10.1.0.13 route-map EXPORT out
  neighbor 10.1.0.15 route-map IMPORT in
  neighbor 10.1.0.15 route-map EXPORT out
  maximum-paths 64
 exit-address-family
exit
!
