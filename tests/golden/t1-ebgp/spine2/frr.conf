frr defaults datacenter
hostname spine2
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.2/32
exit
!
interface eth1
 description fabric to leaf1
 ip address 10.1.0.3/31
exit
!
interface eth2
 description fabric to leaf2
 ip address 10.1.0.7/31
exit
!
interface eth3
 description fabric to leaf3
 ip address 10.1.0.11/31
exit
!
interface eth4
 description fabric to leaf4
 ip address 10.1.0.15/31
exit
!
ip prefix-list LOCAL seq 5 permit 10.0.0.2/32
!
route-map IMPORT permit 10
exit
!
route-map EXPORT permit 10
exit
!
router bgp 65000
 bgp router-id 10.0.0.2
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 timers bgp 1 3
 neighbor 10.1.0.2 remote-as 65101
 neighbor 10.1.0.2 description leaf1
 neighbor 10.1.0.2 timers connect 2
 neighbor 10.1.0.6 remote-as 65102
 neighbor 10.1.0.6 description leaf2
 neighbor 10.1.0.6 timers connect 2
 neighbor 10.1.0.10 remote-as 65103
 neighbor 10.1.0.10 description leaf3
 neighbor 10.1.0.10 timers connect 2
 neighbor 10.1.0.14 remote-as 65104
 neighbor 10.1.0.14 description leaf4
 neighbor 10.1.0.14 timers connect 2
 !
 address-family ipv4 unicast
  network 10.0.0.2/32
  neighbor 10.1.0.2 route-map IMPORT in
  neighbor 10.1.0.2 route-map EXPORT out
  neighbor 10.1.0.6 route-map IMPORT in
  neighbor 10.1.0.6 route-map EXPORT out
  neighbor 10.1.0.10 route-map IMPORT in
  neighbor 10.1.0.10 route-map EXPORT out
  neighbor 10.1.0.14 route-map IMPORT in
  neighbor 10.1.0.14 route-map EXPORT out
  maximum-paths 64
 exit-address-family
exit
!
