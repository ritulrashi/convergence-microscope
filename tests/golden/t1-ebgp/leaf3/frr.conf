frr defaults datacenter
hostname leaf3
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.5/32
exit
!
interface eth1
 description fabric to spine1
 ip address 10.1.0.8/31
exit
!
interface eth2
 description fabric to spine2
 ip address 10.1.0.10/31
exit
!
interface eth3
 description host to h3
 ip address 10.10.3.1/24
exit
!
ip prefix-list LOCAL seq 5 permit 10.0.0.5/32
ip prefix-list LOCAL seq 10 permit 10.10.3.0/24
!
route-map IMPORT permit 10
exit
!
route-map EXPORT permit 10
 match ip address prefix-list LOCAL
exit
!
router bgp 65103
 bgp router-id 10.0.0.5
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 timers bgp 1 3
 neighbor 10.1.0.9 remote-as 65000
 neighbor 10.1.0.9 description spine1
 neighbor 10.1.0.9 timers connect 2
 neighbor 10.1.0.11 remote-as 65000
 neighbor 10.1.0.11 description spine2
 neighbor 10.1.0.11 timers connect 2
 !
 address-family ipv4 unicast
  network 10.0.0.5/32
  network 10.10.3.0/24
  neighbor 10.1.0.9 route-map IMPORT in
  neighbor 10.1.0.9 route-map EXPORT out
  neighbor 10.1.0.11 route-map IMPORT in
  neighbor 10.1.0.11 route-map EXPORT out
  maximum-paths 64
 exit-address-family
exit
!
