frr defaults datacenter
hostname spine1
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.1/32
exit
!
interface eth1
 description fabric to leaf1
 ip address 10.1.0.1/31
exit
!
interface eth2
 description fabric to leaf2
 ip address 10.1.0.5/31
exit
!
interface eth3
 description fabric to leaf3
 ip address 10.1.0.9/31
exit
!
interface eth4
 description fabric to leaf4
 ip address 10.1.0.13/31
exit
!
ip prefix-list LOCAL seq 5 permit 10.0.0.1/32
!
route-map IMPORT permit 10
exit
!
route-map EXPORT permit 10
exit
!
router bgp 65000
 bgp router-id 10.0.0.1
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 timers bgp 1 3
 neighbor 10.1.0.0 remote-as 65101
 neighbor 10.1.0.0 description leaf1
 neighbor 10.1.0.0 timers connect 2
 neighbor 10.1.0.4 remote-as 65102
 neighbor 10.1.0.4 description leaf2
 neighbor 10.1.0.4 timers connect 2
 neighbor 10.1.0.8 remote-as 65103
 neighbor 10.1.0.8 description leaf3
 neighbor 10.1.0.8 timers connect 2
 neighbor 10.1.0.12 remote-as 65104
 neighbor 10.1.0.12 description leaf4
 neighbor 10.1.0.12 timers connect 2
 !
 address-family ipv4 unicast
  network 10.0.0.1/32
  neighbor 10.1.0.0 route-map IMPORT in
  neighbor 10.1.0.0 route-map EXPORT out
  neighbor 10.1.0.4 route-map IMPORT in
  neighbor 10.1.0.4 route-map EXPORT out
  neighbor 10.1.0.8 route-map IMPORT in
  neighbor 10.1.0.8 route-map EXPORT out
  neighbor 10.1.0.12 route-map IMPORT in
  neighbor 10.1.0.12 route-map EXPORT out
  maximum-paths 64
 exit-address-family
exit
!
