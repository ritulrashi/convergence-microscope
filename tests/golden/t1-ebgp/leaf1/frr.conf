frr defaults datacenter
hostname leaf1
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.3/32
exit
!
interface eth1
 description fabric to spine1
 ip address 10.1.0.0/31
exit
!
interface eth2
 description fabric to spine2
 ip address 10.1.0.2/31
exit
!
interface eth3
 description host to h1
 ip address 10.10.1.1/24
exit
!
ip prefix-list LOCAL seq 5 permit 10.0.0.3/32
ip prefix-list LOCAL seq 10 permit 10.10.1.0/24
!
route-map IMPORT permit 10
exit
!
route-map EXPORT permit 10
 match ip address prefix-list LOCAL
exit
!
router bgp 65101
 bgp router-id 10.0.0.3
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 timers bgp 1 3
 neighbor 10.1.0.1 remote-as 65000
 neighbor 10.1.0.1 description spine1
 neighbor 10.1.0.1 timers connect 2
 neighbor 10.1.0.3 remote-as 65000
 neighbor 10.1.0.3 description spine2
 neighbor 10.1.0.3 timers connect 2
 !
 address-family ipv4 unicast
  network 10.0.0.3/32
  network 10.10.1.0/24
  neighbor 10.1.0.1 route-map IMPORT in
  neighbor 10.1.0.1 route-map EXPORT out
  neighbor 10.1.0.3 route-map IMPORT in
  neighbor 10.1.0.3 route-map EXPORT out
  maximum-paths 64
 exit-address-family
exit
!
